name: Cypress tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    name: API + Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails fast, with a clear message, when demoqa is offline.
      - name: Health check - is demoqa up?
        uses: cypress-io/github-action@v7
        with:
          command: npm run test:health

      - name: Run the tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npm run test:ci

      - name: Upload the reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results
          path: |
            reports
            cypress/screenshots
          if-no-files-found: ignore
